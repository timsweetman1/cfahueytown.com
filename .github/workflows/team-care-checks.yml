name: Team Care checks
on:
  pull_request:
    paths: ['team-care/**', '.github/workflows/team-care-checks.yml']
  push:
    branches: [main]
    paths: ['team-care/**', '.github/workflows/team-care-checks.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: team-care
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: team-care/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
