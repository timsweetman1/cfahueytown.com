name: Team Care checks
on:
  pull_request:
    paths: ['team-care/**', 'api/**', 'package*.json', 'vercel.json', '.github/workflows/team-care-checks.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
